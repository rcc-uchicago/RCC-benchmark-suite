# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - cuda@12.9.0
  - nccl cuda_arch=80
  - openmpi@4.1.8+cuda+legacylaunchers cuda_arch=80 schedulers=slurm
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      externals:
      - spec: gcc@8.4.1 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
